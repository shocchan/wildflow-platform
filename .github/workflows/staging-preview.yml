# ステージング（wildflow-platform-staging.*.workers.dev）へのプレビュー配信。
# 2026-09-18 バドミントン・ピボットで追加。本番（wrangler deploy、main）には一切触れない。
# ローカルの wrangler OAuth トークンに workers:write が無く手元から staging を出せなかったため、
# CI の CLOUDFLARE_API_TOKEN で staging 環境だけをデプロイする。
name: Staging preview

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # staging では GA4 を入れない（analytics.ts 側でも本番ドメイン以外は送信しない）

      - name: Deploy to staging Worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9e3a76dce49e8c31804afc8b0f3b2489
